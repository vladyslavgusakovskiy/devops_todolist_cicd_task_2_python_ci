name: CI for Python app
run-name: ${{ github.actor}} - ${{ github.ref_name}} - ${{ github.sha}}

on:
  push:
    branches: ["main", "develop", "develop2"]
  pull_request:
    branches: ["main"]

env:
    PYTHON_VERSION: '3.13'

jobs:
    python-ci:
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v5

        - uses: actions/setup-python@v6
          name: Set up Python ${{ env.PYTHON_VERSION }}
          with:
            python-version: ${{ env.PYTHON_VERSION }}

        - name: Install dependencies
          run: |
            python -m pip install --upgrade pip
            pip install flake8 coverage
            pip install -r ./src/requirements.txt

        - name: Lint with flake8
          run: |
            flake8 ./src --show-source --statistics --exit-zero

        - name: Check complexity
          run: |
            flake8 ./src --max-complexity=10 --statistics --exit-zero

        - name: Run tests with coverage
          run: |
            python ./src/manage.py test
            coverage run ./src/manage.py test
            coverage report -m