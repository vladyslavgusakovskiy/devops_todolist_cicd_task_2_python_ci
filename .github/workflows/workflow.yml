name: Python CI
run-name: ${{ github.actor }} - ${{ github.ref_name }} - ${{ github.sha }}

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  PYTHON_VERSION: 3.8

jobs:
  python-ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./src

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 coverage
          pip install -r ./src/requirements.txt

      - name: Check code style with flake8 (non-blocking)
        run: flake8 . --show-source --statistics
        continue-on-error: true

      - name: Check complexity
        run: flake8 . --exit-zero --max-complexity=10 --statistics
        continue-on-error: true

      - name: Run tests and generate coverage report
        run: |
          coverage run ./src/manage.py test
          coverage report
          coverage json

      - name: Upload Python code as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-source-code
          path: ./src
